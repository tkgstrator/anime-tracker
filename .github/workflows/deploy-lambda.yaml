name: Deploy Lambda

on:
  pull_request:
    branches:
      - develop
      - master
    types: [closed]
  workflow_dispatch:

# OIDC で AWS ロールを assume するために id-token: write が必須
permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambda:
    name: Deploy Lambda (fetch)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Build lambda bundle
        run: bun run lambda/fetch/build.ts
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::801945369170:role/github-actions-lambda-deploy
          aws-region: ap-northeast-1
      - name: Download bun-runtime layer
        run: |
          VER=$(aws lambda list-layer-versions --layer-name bun-runtime --region us-east-1 --query 'LayerVersions[0].Version' --output text)
          URL=$(aws lambda get-layer-version --layer-name bun-runtime --version-number "$VER" --region us-east-1 --query 'Content.Location' --output text)
          mkdir -p lambda/layers
          curl -fsSL -o lambda/layers/bun-runtime.zip "$URL"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false -reconfigure \
            -backend-config="access_key=${{ secrets.R2_STATE_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}"
      - name: Preserve deployed R2 image env
        run: |
          for k in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID; do
            v=$(aws lambda get-function-configuration --function-name anime-tracker-fetch --region ap-northeast-1 --query "Environment.Variables.$k" --output text)
            echo "::add-mask::$v"
            case "$k" in
              R2_ACCESS_KEY_ID) echo "TF_VAR_r2_image_access_key_id=$v" >> "$GITHUB_ENV" ;;
              R2_SECRET_ACCESS_KEY) echo "TF_VAR_r2_image_secret_access_key=$v" >> "$GITHUB_ENV" ;;
              R2_ACCOUNT_ID) echo "TF_VAR_r2_account_id=$v" >> "$GITHUB_ENV" ;;
            esac
          done
      - name: Terraform apply (fetch function)
        run: terraform -chdir=infra apply -input=false -auto-approve -target=aws_lambda_function.fetch
