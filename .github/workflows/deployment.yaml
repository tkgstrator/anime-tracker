name: Deploy to Cloudflare Workers
on:
  pull_request:
    branches:
      - develop
      - master
    types: [closed]
jobs:
  deploy:
    name: Deploy workers
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_ENV: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
      - name: Set environment
        run: |
          echo "ENVIRONMENT=$(if [[ '${{ github.event.pull_request.base.ref }}' == '${{ github.event.repository.default_branch }}' ]]; then echo 'production'; else echo 'staging'; fi)" >> $GITHUB_ENV
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        env:
          ENVIRONMENT: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
        with:
          wranglerVersion: latest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply anime-tracker-${{ env.ENVIRONMENT }} --env ${{ env.ENVIRONMENT }} --remote
      - name: Wrangler deploy
        uses: cloudflare/wrangler-action@v4
        env:
          ENVIRONMENT: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
        with:
          wranglerVersion: latest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ env.ENVIRONMENT }} --keep-vars
