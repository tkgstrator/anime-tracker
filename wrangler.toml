# ---- 共通設定 ----

name = "anime-tracker-staging"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
CF_ACCESS_CLIENT_ID = "cfdfd7d6e420692d0d5a04db0872e875.access"
BACKEND_URL = "https://nagisa-backend.tkgstrator.work"

[assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "anime-tracker-staging"
database_id = "e1e78f23-da35-4d74-8de0-667a8d7ddefc"
migrations_dir = "prisma/migrations"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 */1 * * *"]

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "anime-tracker-sync-staging"

[[queues.consumers]]
queue = "anime-tracker-sync-staging"
max_batch_size = 5
max_retries = 3

[dev]
port = 8787
ip = "0.0.0.0"
local_protocol = "http"

# ---- Staging ----

[env.staging]
name = "anime-tracker-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "anime-tracker-staging"
database_id = "e1e78f23-da35-4d74-8de0-667a8d7ddefc"
migrations_dir = "prisma/migrations"

[[env.staging.queues.producers]]
binding = "SYNC_QUEUE"
queue = "anime-tracker-sync-staging"

[[env.staging.queues.consumers]]
queue = "anime-tracker-sync-staging"
max_batch_size = 5
max_retries = 3

# ---- Production ----

[env.production]
name = "anime-tracker-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "anime-tracker-production"
database_id = "local"
migrations_dir = "prisma/migrations"

[[env.production.queues.producers]]
binding = "SYNC_QUEUE"
queue = "anime-tracker-sync-production"

[[env.production.queues.consumers]]
queue = "anime-tracker-sync-production"
max_batch_size = 5
max_retries = 3
